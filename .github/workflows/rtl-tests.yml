name: RTL verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # Full-height storage plus full-width raw-window compute checks.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Check embedded RTL documentation
        run: python scripts/check_walkthrough.py
      - name: Compile and simulate standalone modules and integrated engine
        run: python scripts/run_tests.py
      - name: Check testbench fault sensitivity
        run: python scripts/check_test_sensitivity.py
      - name: Exercise teaching bench and compiled fault detection
        run: python scripts/run_testbench_lab.py --check-faults --examples
      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-simulation-results
          path: |
            sim/*.txt
            tests/rtl/*.sv
            tests/rtl/*.svh
            tests/lab/*.sv
            build/lab/*.log
            build/lab/reference.vcd
            build/lab/datapath_examples.vcd
            build/legacy-buffer/k*/tb.sv
            build/mutation-checks/*/result.txt
            build/control/**/control_*.csv
            build/control-sensitivity/**/result.txt
            build/control-sensitivity/evidence.json
          if-no-files-found: warn
